<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/><stop offset=".55" stop-color="#1a3a8f"/><stop offset="1" stop-color="#5b3cc4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".5">
      <stop offset="0" stop-color="#6fa8ff" stop-opacity=".55"/><stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d98a"/><stop offset=".5" stop-color="#ffeebb"/><stop offset="1" stop-color="#d9a93f"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".14"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="600" height="850" fill="url(#bg)"/>
  <rect width="600" height="850" fill="url(#grid)"/>
  <rect width="600" height="850" fill="url(#glow)"/>
  <!-- decorative tags -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#fff" fill-opacity=".1" font-weight="700">
    <text x="-10" y="120" font-size="120">&lt;/&gt;</text>
    <text x="330" y="835" font-size="150">{ }</text>
  </g>
  <!-- top label -->
  <text x="300" y="86" text-anchor="middle" font-size="15" letter-spacing="6" fill="url(#gold)" font-weight="600">ЭЛЕКТРОНДЫҚ ОҚУЛЫҚ</text>
  <rect x="215" y="100" width="170" height="2" fill="url(#gold)"/>
  <!-- browser window -->
  <g filter="url(#sh)">
    <rect x="95" y="150" width="410" height="270" rx="16" fill="#0d1630"/>
    <path d="M95 166a16 16 0 0 1 16-16h378a16 16 0 0 1 16 16v28H95z" fill="#1c2a55"/>
    <circle cx="121" cy="172" r="6" fill="#ff5f56"/><circle cx="141" cy="172" r="6" fill="#ffbd2e"/><circle cx="161" cy="172" r="6" fill="#27c93f"/>
    <rect x="190" y="162" width="290" height="20" rx="10" fill="#0d1630"/>
    <text x="205" y="176.5" font-size="11" fill="#8fa7ff" font-family="Consolas, monospace">https://webbook.kz</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="120" y="228" fill="#ff7b8b">&lt;html&gt;</text>
    <text x="138" y="252" fill="#ff7b8b">&lt;body&gt;</text>
    <text x="156" y="276" fill="#ff7b8b">&lt;h1&gt;<tspan fill="#a8e08a">Сәлем, Web!</tspan><tspan fill="#ff7b8b">&lt;/h1&gt;</tspan></text>
    <text x="156" y="300" fill="#c792ea">const <tspan fill="#d6e4f0">x</tspan> <tspan fill="#d6e4f0">=</tspan> <tspan fill="#f9c46b">2026</tspan><tspan fill="#d6e4f0">;</tspan></text>
    <text x="156" y="324" fill="#c792ea">echo <tspan fill="#a8e08a">"PHP"</tspan><tspan fill="#d6e4f0">;</tspan></text>
    <text x="138" y="348" fill="#ff7b8b">&lt;/body&gt;</text>
    <text x="120" y="372" fill="#ff7b8b">&lt;/html&gt;</text>
  </g>
  <rect x="120" y="388" width="160" height="6" rx="3" fill="#2e86c1"/><rect x="290" y="388" width="90" height="6" rx="3" fill="#7c4dff" fill-opacity=".8"/>
  <!-- title -->
  <text x="300" y="520" text-anchor="middle" font-size="60" font-weight="800" fill="#fff" letter-spacing="2">WEB</text>
  <text x="300" y="582" text-anchor="middle" font-size="50" font-weight="800" fill="url(#gold)" textLength="470" lengthAdjust="spacingAndGlyphs">БАҒДАРЛАМАЛАУ</text>
  <rect x="150" y="606" width="300" height="2" fill="url(#gold)"/>
  <text x="300" y="640" text-anchor="middle" font-size="17" fill="#cfe0ff" font-style="italic">HTML5 · CSS3 · JavaScript · PHP</text>
  <!-- chips -->
  <g font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="118" y="668" width="70" height="26" rx="13" fill="#ffffff" fill-opacity=".14"/><text x="153" y="686" fill="#fff">HTML5</text>
    <rect x="198" y="668" width="62" height="26" rx="13" fill="#ffffff" fill-opacity=".14"/><text x="229" y="686" fill="#fff">CSS3</text>
    <rect x="270" y="668" width="52" height="26" rx="13" fill="#ffffff" fill-opacity=".14"/><text x="296" y="686" fill="#fff">JS</text>
    <rect x="332" y="668" width="56" height="26" rx="13" fill="#ffffff" fill-opacity=".14"/><text x="360" y="686" fill="#fff">PHP</text>
    <rect x="398" y="668" width="84" height="26" rx="13" fill="#ffffff" fill-opacity=".14"/><text x="440" y="686" fill="#fff">MySQL</text>
  </g>
  <!-- bottom -->
  <text x="300" y="768" text-anchor="middle" font-size="14" fill="#e6eeff">6В06101 — «Бағдарламалық инженерия»</text>
  <text x="300" y="790" text-anchor="middle" font-size="12" fill="#aebfe8">С. Сейфуллин атындағы Қазақ агротехникалық зерттеу университеті</text>
  <text x="300" y="822" text-anchor="middle" font-size="13" fill="url(#gold)" letter-spacing="3">2026</text>
  <!-- frame + spine -->
  <rect x="16" y="16" width="568" height="818" rx="6" fill="none" stroke="url(#gold)" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="0" y="0" width="34" height="850" fill="url(#spine)"/>
</svg>
